<!-- @dsCard height=288 -->
<style>
  html, body { margin: 0; background: var(--paper); }
  .cv { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--paper); font-family: var(--font-sans); }
  .cv svg { position: absolute; left: 0; top: 0; }
  .ink { fill: var(--ink); } .acc { fill: var(--accent); } .surf { fill: var(--surface); } .ln { fill: var(--line); } .mut { fill: var(--muted); }
  .box { rx: var(--radius-md); }
  .rule { stroke: var(--line); stroke-width: 1; } .rule-ink { stroke: var(--ink); stroke-width: 1; }
  .name { position: absolute; left: 48px; bottom: 76px; margin: 0; font-size: 88px; line-height: .95; font-weight: 700; letter-spacing: -0.055em; color: var(--ink); max-width: 440px; }
  .tag { position: absolute; left: 50px; bottom: 44px; margin: 0; font-size: 14px; color: var(--muted); max-width: 440px; }
</style>
<div class="cv">
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <!-- blocks: ink 172×176, accent 180×112, surface 180×64, line 116×48 (space-24/space-20/space-16 multiples), radius-none + one radius-md box
         arrangement: the article-row grid (118 / 1fr / 180 columns) turned into a flush modular slab, bleeding off the top and right
         pattern: editorial row — "区切りは罫線。影は使わない" — four hairline rules (line, 1px) plus the ink section-rule crossing the blocks
         steps: space-6 24px gutters, space-12 48px row pitch, radius-md 4px on the accent box only -->
    <rect class="surf" x="508" y="0" width="452" height="288"/>
    <rect class="ink" x="788" y="0" width="172" height="176"/>
    <rect class="acc box" x="584" y="48" width="180" height="112"/>
    <rect class="ln" x="672" y="200" width="116" height="48"/>
    <rect class="paper" style="fill:var(--paper)" x="508" y="200" width="140" height="48"/>
    <line class="rule-ink" x1="480" y1="176" x2="960" y2="176"/>
    <line class="rule" x1="480" y1="200" x2="960" y2="200"/>
    <line class="rule" x1="480" y1="248" x2="960" y2="248"/>
    <line class="rule" x1="584" y1="0" x2="584" y2="288"/>
    <line class="rule" x1="764" y1="0" x2="764" y2="288"/>
  </svg>
  <p class="name">obi1.dev</p>
  <p class="tag">静かな編集室——白地、墨の文字、青灰、細い罫線。</p>
</div>
